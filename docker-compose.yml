services:
  etcd:
    container_name: zhanggui-etcd
    image: quay.io/coreos/etcd:v3.5.25
    volumes:
      - D:/Desktop/PythonProject/volumes/etcd:/etcd
    command: >
      etcd -advertise-client-urls=http://etcd:2379
           -listen-client-urls http://0.0.0.0:2379
           --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  milvus:
    container_name: zhanggui-milvus
    image: milvusdb/milvus:v2.5.5
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      STORAGE_TYPE: local
      MQ_TYPE: rocksmq
      MINIO_ADDRESS: host.docker.internal:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
    restart: always

  attu:
    container_name: zhanggui-attu
    image: zilliz/attu:latest
    environment:
      - MILVUS_URL=milvus:19530
      - SERVER_PORT=7000
    ports:
      - "7000:7000"
    depends_on:
      - milvus
    restart: always

  neo4j:
    container_name: zhanggui-neo4j
    image: neo4j:latest
    volumes:
      - D:/Desktop/PythonProject/volumes/neo4j/data:/data
      - D:/Desktop/PythonProject/volumes/neo4j/logs:/logs
      - D:/Desktop/PythonProject/volumes/neo4j/plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/123123123
    ports:
      - "7474:7474"
      - "7687:7687"
    restart: always

  mongodb:
    container_name: zhanggui-mongodb
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - D:/Desktop/PythonProject/volumes/mongodb/data:/data/db
    restart: always

networks:
  default:
    name: zhanggui-net
