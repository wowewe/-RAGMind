<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>RAGMind · Chat</title>
  <style>
    :root{
      --bg:#eef1f6;
      --panel:#ffffff;
      --panel2:#f7f9fc;
      --text:#17202a;
      --muted:#68788c;
      --brand:#1aa7ff;
      --brand2:#5b7cfa;
      --bubble-user:linear-gradient(135deg,#1aa7ff,#5b7cfa);
      --bubble-bot:#f2f5fa;
      --border:#dfe5ee;
      --ok:#0e9f6e;
      --err:#e74c3c;
      --warn:#c47d0f;
      --shadow:0 16px 40px rgba(23,32,42,.14);
      --chat-bg:linear-gradient(180deg, rgba(26,167,255,.05), transparent 38%),
                 linear-gradient(0deg, rgba(91,124,250,.05), transparent 42%);
    }
    [data-theme="dark"]{
      --bg:#0d1220;
      --panel:#151c2e;
      --panel2:#1b2438;
      --text:#e8edf5;
      --muted:#8b99ad;
      --bubble-bot:#202b42;
      --border:#2a3650;
      --shadow:0 16px 40px rgba(0,0,0,.5);
      --chat-bg:linear-gradient(180deg, rgba(26,167,255,.06), transparent 38%),
                 linear-gradient(0deg, rgba(91,124,250,.06), transparent 42%);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,Arial,sans-serif;
      background: radial-gradient(1200px 600px at 15% 0%, rgba(26,167,255,.16), transparent 60%),
                  radial-gradient(1000px 500px at 90% 10%, rgba(91,124,250,.16), transparent 55%),
                  var(--bg);
      color:var(--text);
      transition:background .3s, color .3s;
    }
    .app{
      width:100%;
      height:100%;
      display:flex;
      justify-content:center;
      padding:18px;
    }
    .shell{
      width:100%;
      max-width:1180px;
      height:min(860px, 94vh);
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:20px;
      box-shadow:var(--shadow);
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    /* ---------- Top bar ---------- */
    .topbar{
      display:flex;
      align-items:center;
      gap:14px;
      padding:14px 20px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(90deg, rgba(26,167,255,.08), rgba(91,124,250,.08));
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .logo{
      width:38px;height:38px;border-radius:11px;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
      display:flex;align-items:center;justify-content:center;
      color:#fff;font-weight:700;font-size:18px;
      box-shadow:0 8px 18px rgba(26,167,255,.3);
      flex:0 0 auto;
    }
    .title{display:flex;flex-direction:column;line-height:1.15;min-width:0}
    .title strong{font-size:15px;letter-spacing:.2px}
    .title span{font-size:12px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px}
    .status-dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
    .status-dot.on{background:var(--ok);box-shadow:0 0 0 3px rgba(14,159,110,.18)}
    .status-dot.off{background:var(--err)}
    .top-actions{margin-left:auto;display:flex;gap:10px;align-items:center}
    .icon-btn{
      border:1px solid var(--border);background:var(--panel);
      color:var(--muted);width:34px;height:34px;border-radius:10px;
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;font-size:15px;transition:color .15s, border-color .15s;
    }
    .icon-btn:hover{color:var(--brand);border-color:rgba(26,167,255,.5)}
    .mode-switch{
      display:flex;align-items:center;gap:6px;
      font-size:12px;color:var(--muted);
      border:1px solid var(--border);background:var(--panel);
      padding:6px 12px;border-radius:999px;cursor:pointer;user-select:none;
    }
    .mode-switch input{display:none}
    .mode-switch .dot2{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);position:relative}
    .mode-switch input:checked + .dot2{background:var(--brand);border-color:var(--brand)}
    /* ---------- Body ---------- */
    .body{flex:1;display:flex;min-height:0}
    /* Sidebar */
    .sidebar{
      width:232px;flex:0 0 auto;
      border-right:1px solid var(--border);
      background:var(--panel2);
      display:flex;flex-direction:column;
      padding:14px;
      gap:10px;
    }
    .new-chat{
      border:none;cursor:pointer;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
      color:#fff;font-size:13px;font-weight:600;
      padding:11px 14px;border-radius:12px;
      display:flex;align-items:center;justify-content:center;gap:8px;
      box-shadow:0 8px 18px rgba(26,167,255,.25);
      transition:transform .12s, box-shadow .12s;
    }
    .new-chat:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(26,167,255,.32)}
    .sess-label{font-size:11px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin:6px 4px 0}
    .sess-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px}
    .sess{
      border:1px solid transparent;background:transparent;
      border-radius:10px;padding:9px 11px;cursor:pointer;
      text-align:left;display:flex;flex-direction:column;gap:3px;
      transition:background .15s, border-color .15s;
    }
    .sess:hover{background:var(--panel)}
    .sess.active{background:var(--panel);border-color:rgba(26,167,255,.4)}
    .sess .s-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .sess .s-meta{font-size:11px;color:var(--muted)}
    .sess .s-del{
      margin-left:auto;border:none;background:transparent;color:var(--muted);
      cursor:pointer;font-size:12px;border-radius:6px;padding:2px 6px;
      visibility:hidden;
    }
    .sess:hover .s-del{visibility:visible}
    .sess .s-del:hover{color:var(--err);background:rgba(231,76,60,.1)}
    .sess .s-top{display:flex;align-items:center;gap:6px}
    /* Main */
    .main{flex:1;display:flex;flex-direction:column;min-width:0}
    .chat{
      flex:1;overflow:auto;
      padding:22px 24px 8px;
      background:var(--chat-bg);
    }
    .chat::-webkit-scrollbar{width:8px}
    .chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
    /* Welcome */
    .welcome{
      max-width:720px;margin:0 auto;
      padding-top:12vh;text-align:center;
      animation:fadeUp .35s ease;
    }
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .welcome h1{font-size:24px;margin:0 0 8px;letter-spacing:.3px}
    .welcome p{color:var(--muted);font-size:14px;margin:0 0 26px}
    /* Messages */
    .msg{display:flex;gap:12px;margin:14px 0;align-items:flex-start;animation:fadeUp .25s ease}
    .msg.user{justify-content:flex-end}
    .avatar{
      width:36px;height:36px;border-radius:11px;flex:0 0 auto;
      display:flex;align-items:center;justify-content:center;
      font-size:11px;font-weight:700;letter-spacing:.3px;
      background:linear-gradient(135deg, rgba(26,167,255,.16), rgba(91,124,250,.16));
      color:var(--brand);border:1px solid rgba(26,167,255,.25);
    }
    .msg.user .avatar{background:linear-gradient(135deg, var(--brand), var(--brand2));color:#fff;border-color:transparent}
    .col{max-width:min(720px,78%);min-width:0;display:flex;flex-direction:column;align-self:flex-start}
    .msg.user .col{align-items:flex-end}
    .bubble{
      display:inline-block;border-radius:16px;padding:12px 15px;
      background:var(--bubble-bot);border:1px solid var(--border);
      line-height:1.6;font-size:14px;
      white-space:pre-wrap;overflow-wrap:break-word;
      max-width:100%;
    }
    .msg.user .bubble{background:var(--bubble-user);color:#fff;border-color:transparent}
    .meta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:8px;align-items:center;padding:0 4px}
    .msg.user .meta{color:var(--muted)}
    .answer-text{white-space:pre-wrap;overflow-wrap:break-word}
    .answer-images{margin-top:12px;display:flex;flex-direction:column;gap:10px}
    .answer-images img{
      display:block;max-width:min(100%,560px);max-height:560px;
      border-radius:12px;border:1px solid var(--border);
      box-shadow:0 10px 24px rgba(23,32,42,.12);
      background:#fff;
    }
    .answer-images a{font-size:12px;color:var(--muted);text-decoration:none;word-break:break-all}
    /* Action row */
    .actions{display:flex;gap:6px;margin-top:8px;padding:0 4px}
    .mini-btn{
      border:1px solid var(--border);background:var(--panel);
      color:var(--muted);font-size:12px;
      padding:4px 10px;border-radius:8px;cursor:pointer;
      transition:color .15s, border-color .15s;
    }
    .mini-btn:hover{color:var(--brand);border-color:rgba(26,167,255,.5)}
    .mini-btn.danger:hover{color:var(--err);border-color:rgba(231,76,60,.5)}
    /* Typing */
    .typing{display:inline-flex;gap:5px;align-items:center;padding:2px 0}
    .dot{width:7px;height:7px;border-radius:50%;background:#9aa6b2;animation:bounce 1.2s infinite ease-in-out}
    .dot:nth-child(2){animation-delay:.15s}
    .dot:nth-child(3){animation-delay:.3s}
    @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.6}40%{transform:translateY(-5px);opacity:1}}
    /* Stage chips */
    .stages{margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
    .stage{
      font-size:12px;padding:4px 11px;border-radius:999px;
      border:1px solid var(--border);background:var(--panel);
      color:var(--muted);display:inline-flex;align-items:center;gap:6px;
    }
    .stage.done{color:#0e9f6e;border-color:rgba(14,159,110,.35);background:rgba(14,159,110,.07)}
    .stage.active{color:var(--brand);border-color:rgba(26,167,255,.45);background:rgba(26,167,255,.08)}
    .stage.active .spinner{width:10px;height:10px;border:2px solid rgba(26,167,255,.3);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .stage.err{color:var(--err);border-color:rgba(231,76,60,.4);background:rgba(231,76,60,.06)}
    /* Composer */
    .composer-wrap{
      border-top:1px solid var(--border);
      background:var(--panel);
      padding:14px 20px 12px;
    }
    .composer{
      display:flex;gap:10px;align-items:flex-end;
      max-width:900px;margin:0 auto;
    }
    textarea{
      flex:1;resize:none;
      min-height:46px;max-height:150px;
      padding:12px 14px;
      border-radius:14px;
      border:1px solid var(--border);
      background:var(--panel2);
      color:var(--text);
      outline:none;font-size:14px;line-height:1.5;font-family:inherit;
    }
    textarea:focus{border-color:rgba(26,167,255,.6);box-shadow:0 0 0 3px rgba(26,167,255,.12)}
    textarea::placeholder{color:var(--muted)}
    .send{
      height:46px;padding:0 22px;
      border:none;border-radius:14px;cursor:pointer;
      font-size:14px;font-weight:600;color:#fff;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
      box-shadow:0 8px 18px rgba(26,167,255,.25);
      transition:transform .12s, opacity .15s;
    }
    .send:hover:not(:disabled){transform:translateY(-1px)}
    .send:disabled{opacity:.55;cursor:not-allowed}
    .hint{
      max-width:900px;margin:10px auto 0;
      color:var(--muted);font-size:12px;
      display:flex;align-items:center;gap:6px;
    }
    .kbd{
      font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      border:1px solid var(--border);padding:1px 6px;border-radius:6px;
      background:var(--panel2);color:var(--muted);
    }
    .toast{
      position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(10px);
      background:var(--text);color:var(--bg);
      font-size:13px;padding:9px 18px;border-radius:999px;
      opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:99;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media (max-width:760px){
      .app{padding:0}
      .shell{height:100vh;max-height:none;border-radius:0;border:none}
      .sidebar{display:none}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="shell">
      <div class="topbar">
        <div class="brand">
          <div class="logo">R</div>
          <div class="title">
            <strong>RAGMind</strong>
            <span><span class="status-dot" id="statusDot"></span><span id="statusText">Connecting…</span></span>
          </div>
        </div>
        <div class="top-actions">
          <label class="mode-switch" title="Streaming output">
            <input type="checkbox" id="streamToggle" checked>
            <span class="dot2"></span>Stream
          </label>
          <button class="icon-btn" id="btnClear" title="Clear current chat">🗑</button>
          <button class="icon-btn" id="btnTheme" title="Toggle theme">🌓</button>
        </div>
      </div>

      <div class="body">
        <aside class="sidebar">
          <button class="new-chat" id="btnNew">＋ New chat</button>
          <div class="sess-label">Sessions</div>
          <div class="sess-list" id="sessList"></div>
        </aside>

        <main class="main">
          <div class="chat" id="chat"></div>

          <div class="composer-wrap">
            <div class="composer">
              <textarea id="input" rows="1" placeholder="Ask about your knowledge base… (Enter to send, Shift+Enter for new line)"></textarea>
              <button class="send" id="send">Send</button>
            </div>
            <div class="hint">
              <span class="kbd">Enter</span> send · <span class="kbd">Shift</span>+<span class="kbd">Enter</span> new line
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API_BASE = `${location.protocol}//${location.host}`.includes('http') ? `${location.protocol}//${location.host}` : 'http://127.0.0.1:8001';
    const SESS_KEY = 'ragmind_sessions';
    const CUR_KEY = 'ragmind_current_session';

    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const btnClear = document.getElementById('btnClear');
    const btnNew = document.getElementById('btnNew');
    const btnTheme = document.getElementById('btnTheme');
    const streamToggle = document.getElementById('streamToggle');
    const sessListEl = document.getElementById('sessList');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const toastEl = document.getElementById('toast');

    // ---------- theme ----------
    if (localStorage.getItem('ragmind_theme') === 'dark') {
      document.documentElement.dataset.theme = 'dark';
    }
    btnTheme.addEventListener('click', () => {
      const dark = document.documentElement.dataset.theme === 'dark';
      if (dark) {
        delete document.documentElement.dataset.theme;
        localStorage.setItem('ragmind_theme', 'light');
      } else {
        document.documentElement.dataset.theme = 'dark';
        localStorage.setItem('ragmind_theme', 'dark');
      }
    });

    // ---------- session store ----------
    function loadSessions(){
      try { return JSON.parse(localStorage.getItem(SESS_KEY) || '{}'); }
      catch(e) { return {}; }
    }
    function saveSessions(map){
      localStorage.setItem(SESS_KEY, JSON.stringify(map));
    }
    function currentSession(){
      let id = localStorage.getItem(CUR_KEY);
      if (!id) {
        // migrate from the previous design's key so existing history keeps loading
        const legacy = localStorage.getItem('kb_session_id');
        id = legacy || newSessionId();
        localStorage.setItem(CUR_KEY, id);
      }
      return id;
    }
    function newSessionId(){
      return 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    }
    function touchSession(id, title){
      const map = loadSessions();
      map[id] = { title: title || map[id]?.title || 'New chat', ts: Date.now() };
      saveSessions(map);
    }

    // ---------- session list ----------
    function renderSessions(){
      const map = loadSessions();
      const cur = currentSession();
      const ids = Object.keys(map).sort((a,b) => (map[b].ts||0) - (map[a].ts||0));
      if (ids.length === 0 || !map[cur]) {
        sessListEl.innerHTML = '<div style="font-size:12px;color:var(--muted);padding:4px">No saved sessions yet</div>';
        return;
      }
      sessListEl.innerHTML = '';
      for (const id of ids) {
        const s = map[id];
        const el = document.createElement('div');
        el.className = 'sess' + (id === cur ? ' active' : '');
        const d = new Date(s.ts);
        const time = d.toLocaleDateString('en-US', {month:'short', day:'numeric'}) + ' ' +
                     d.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'});
        el.innerHTML = `
          <div class="s-top">
            <span class="s-title">${escapeHtml(s.title)}</span>
            <button class="s-del" title="Delete session">✕</button>
          </div>
          <span class="s-meta">${time}</span>`;
        el.querySelector('.s-del').addEventListener('click', (e) => {
          e.stopPropagation();
          const map2 = loadSessions();
          delete map2[id];
          saveSessions(map2);
          if (id === cur) {
            const keys = Object.keys(map2);
            keys.length ? switchSession(keys[0]) : startNewChat();
          } else {
            renderSessions();
          }
        });
        el.addEventListener('click', () => switchSession(id));
        sessListEl.appendChild(el);
      }
    }

    function switchSession(id){
      localStorage.setItem(CUR_KEY, id);
      renderSessions();
      resetChatView();
      loadHistory();
    }

    function startNewChat(){
      const id = newSessionId();
      localStorage.setItem(CUR_KEY, id);
      touchSession(id);
      renderSessions();
      resetChatView();
      renderWelcome();
    }

    // ---------- chat view ----------
    function resetChatView(){
      chatEl.innerHTML = '';
      scrollToBottom();
    }

    function scrollToBottom(){
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function nowTime(){
      return new Date().toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'});
    }
    function formatTime(ts){
      if (!ts) return nowTime();
      const d = new Date(Number(ts) * 1000);
      if (Number.isNaN(d.getTime())) return nowTime();
      return d.toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'});
    }

    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
        .replaceAll('"','&quot;').replaceAll("'","&#039;");
    }

    function renderWelcome(){
      chatEl.innerHTML = `
        <div class="welcome">
          <h1>Ask your knowledge base</h1>
          <p>Questions are answered from your imported documents, with live web search when needed.</p>
        </div>`;
    }

    // ---------- images ----------
    function isImageUrl(url){
      try {
        const u = new URL(url);
        return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname);
      } catch(e){
        return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || '');
      }
    }
    function normalizeUrl(rawUrl){
      return String(rawUrl || '').trim().replace(/\s/g, '%20');
    }
    function dedupeKeepOrder(arr){
      const seen = new Set(); const out = [];
      for (const x of (Array.isArray(arr) ? arr : [])) {
        const v = String(x || ''); if (!v || seen.has(v)) continue;
        seen.add(v); out.push(v);
      }
      return out;
    }
    function extractUrlsLoose(text){
      const s = String(text || '');
      const regex = /(https?:\/\/[^\s]+)/g;
      const urls = [];
      const trimTail = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
      const trimHead = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');
      for (const m of s.match(regex) || []) {
        const u = trimHead(trimTail(m));
        if (u) urls.push(u);
      }
      return dedupeKeepOrder(urls);
    }
    function findLastImageMarkerIndex(raw){
      const s = String(raw || '');
      const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
      let m, lastIdx = -1, lastLen = 0;
      while ((m = re.exec(s)) !== null) { lastIdx = m.index; lastLen = m[0].length; }
      return { idx: lastIdx, len: lastLen };
    }
    function parseAnswerAndImages(text){
      const raw = String(text || '');
      const { idx, len } = findLastImageMarkerIndex(raw);
      if (idx === -1) return { text: raw, images: [] };
      const before = raw.slice(0, idx).trimEnd();
      const after = raw.slice(idx + len).trim();
      const urls = [];
      for (const line of after.split(/\r?\n/).map(l => l.trim()).filter(Boolean)) {
        if (/^https?:\/\//.test(line)) urls.push(line);
        else urls.push(...extractUrlsLoose(line));
      }
      const seen = new Set(); const images = [];
      for (const u of urls) {
        const normalized = normalizeUrl(u);
        if (!isImageUrl(normalized) || seen.has(normalized)) continue;
        seen.add(normalized); images.push(normalized);
      }
      return { text: before, images };
    }
    function compressBlankLines(text) {
      return text.replace(/\n{3,}/g, '\n\n');
    }
    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls){
      const { text, images: imgBlock } = parseAnswerAndImages(answerText);
      const candidates = Array.isArray(candidateImageUrls) ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl) : [];
      const loose = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);
      const images = dedupeKeepOrder([...imgBlock, ...candidates, ...loose]);

      containerEl.innerHTML = '';
      const textEl = document.createElement('div');
      textEl.className = 'answer-text';
      textEl.textContent = (text || '').trim() ? compressBlankLines((text || '').trimStart()) : '(completed)';
      containerEl.appendChild(textEl);

      if (images.length > 0) {
        const wrap = document.createElement('div');
        wrap.className = 'answer-images';
        for (const url of images) {
          const safe = normalizeUrl(url);
          const img = document.createElement('img');
          img.loading = 'lazy'; img.src = safe; img.alt = 'reference image';
          img.referrerPolicy = 'no-referrer';
          img.addEventListener('error', () => { img.style.display = 'none'; });
          wrap.appendChild(img);
          const a = document.createElement('a');
          a.href = safe; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = url;
          wrap.appendChild(a);
        }
        containerEl.appendChild(wrap);
      }
    }

    // ---------- messages ----------
    function addUserMsg(text, ts){
      const html = `
        <div class="msg user">
          <div class="col">
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${formatTime(ts)}</div>
          </div>
          <div class="avatar">YOU</div>
        </div>`;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addBotMsgSkeleton(){
      const id = 'bot-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar">R</div>
          <div class="col">
            <div class="bubble">
              <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
              <div class="stages" id="${id}-stages"></div>
            </div>
            <div class="meta" id="${id}-meta">${nowTime()} · working…</div>
          </div>
        </div>`;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
      return document.getElementById(id);
    }

    function renderStages(botMsgEl, doneList, runningList, status){
      const wrap = botMsgEl.querySelector('.stages');
      const done = Array.isArray(doneList) ? doneList : [];
      const running = Array.isArray(runningList) ? runningList : [];
      wrap.innerHTML = '';
      for (const d of done) {
        wrap.insertAdjacentHTML('beforeend', `<span class="stage done">✓ ${escapeHtml(d)}</span>`);
      }
      for (const r of running) {
        wrap.insertAdjacentHTML('beforeend', `<span class="stage active"><span class="spinner"></span>${escapeHtml(r)}</span>`);
      }
      if (status === 'failed' && done.length === 0 && running.length === 0) {
        wrap.insertAdjacentHTML('beforeend', `<span class="stage err">✕ Step failed</span>`);
      }
      if (status === 'pending') {
        wrap.insertAdjacentHTML('beforeend', `<span class="stage active"><span class="spinner"></span>Waiting for backend…</span>`);
      }
    }

    function finalizeBotAnswer(botMsgEl, answer, error, imageUrls){
      const bubble = botMsgEl.querySelector('.bubble');
      const meta = botMsgEl.querySelector('.meta');
      bubble.querySelector('.typing')?.remove();
      meta.textContent = formatTime(Date.now() / 1000);

      const err = (error || '').trim();
      if (err) {
        let answerEl = bubble.querySelector('.answer');
        if (!answerEl) {
          answerEl = document.createElement('div');
          answerEl.className = 'answer';
          bubble.appendChild(answerEl);
        }
        answerEl.style.color = 'var(--err)';
        answerEl.textContent = 'Sorry, this request failed:\n' + err;
      } else if (answer !== undefined && answer !== null && String(answer).trim().length > 0) {
        let answerEl = bubble.querySelector('.answer');
        if (!answerEl) {
          answerEl = document.createElement('div');
          answerEl.className = 'answer';
          bubble.appendChild(answerEl);
        }
        renderAnswerWithImages(answerEl, answer, imageUrls || []);
      }
      // If neither branch ran, the answer was already rendered by SSE deltas/final — leave it.

      if (!botMsgEl.querySelector('.actions')) {
        const row = document.createElement('div');
        row.className = 'actions';
        const copyBtn = document.createElement('button');
        copyBtn.className = 'mini-btn';
        copyBtn.textContent = 'Copy';
        copyBtn.addEventListener('click', async () => {
          const text = botMsgEl.querySelector('.answer-text')?.textContent || '';
          try {
            await navigator.clipboard.writeText(text);
            toast('Answer copied');
          } catch(e) { toast('Copy failed'); }
        });
        row.appendChild(copyBtn);
        const col = botMsgEl.querySelector('.col');
        col.appendChild(row);
      }
      scrollToBottom();
    }

    function toast(msg){
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => toastEl.classList.remove('show'), 1800);
    }

    // ---------- backend ----------
    async function checkHealth(){
      try {
        const res = await fetch(`${API_BASE}/health`);
        if (!res.ok) throw new Error('bad');
        statusDot.className = 'status-dot on';
        statusText.textContent = 'Connected';
      } catch(e){
        statusDot.className = 'status-dot off';
        statusText.textContent = 'Offline';
      }
    }

    async function loadHistory(){
      try {
        const res = await fetch(`${API_BASE}/history/${currentSession()}`);
        if (!res.ok) return;
        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        if (items.length === 0) { renderWelcome(); return; }
        resetChatView();
        for (const item of items) {
          if (item.role === 'user') addUserMsg(item.text || '', item.ts);
          else addBotMsgFromHistory(item);
        }
        scrollToBottom();
      } catch(e){ renderWelcome(); }
    }

    function addBotMsgFromHistory(item){
      const id = 'bot-his-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar">R</div>
          <div class="col">
            <div class="bubble"><div class="answer"></div></div>
            <div class="meta">${formatTime(item.ts)}</div>
          </div>
        </div>`;
      chatEl.insertAdjacentHTML('beforeend', html);
      const el = document.getElementById(id);
      if (el) renderAnswerWithImages(el.querySelector('.answer'), item.text || '', item.image_urls || []);
    }

    async function submitQuery(text){
      const res = await fetch(`${API_BASE}/query`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: text, session_id: currentSession(), is_stream: streamToggle.checked })
      });
      if (!res.ok) {
        const msg = await res.text();
        throw new Error(msg || 'Request failed');
      }
      return await res.json();
    }

    async function onSend(){
      const text = (inputEl.value || '').trim();
      if (!text) return;
      inputEl.value = '';
      autoResize();
      touchSession(currentSession(), text.slice(0, 40));
      renderSessions();
      addUserMsg(text);
      const botMsgEl = addBotMsgSkeleton();
      sendBtn.disabled = true;

      try {
        const data = await submitQuery(text);
        renderStages(botMsgEl, [], [], 'pending');

        if (!streamToggle.checked) {
          renderStages(botMsgEl, data.done_list || [], [], 'completed');
          finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
          sendBtn.disabled = false;
          return;
        }

        const { session_id } = data;
        const bubble = botMsgEl.querySelector('.bubble');
        let answerEl = bubble.querySelector('.answer');
        if (!answerEl) {
          answerEl = document.createElement('div');
          answerEl.className = 'answer';
          const stages = bubble.querySelector('.stages');
          if (stages) bubble.insertBefore(answerEl, stages);
          else bubble.appendChild(answerEl);
        }
        let rawAnswerText = '';
        let skipLeadingWhitespace = true;

        const es = new EventSource(`${API_BASE}/stream/${session_id}`);
        let finished = false;
        const finish = () => { if (!finished) { finished = true; es.close(); sendBtn.disabled = false; } };

        es.addEventListener('progress', (e) => {
          try {
            const d = JSON.parse(e.data || '{}');
            renderStages(botMsgEl, d.done_list, d.running_list, d.status);
            if (d.status === 'completed') {
              const typing = botMsgEl.querySelector('.typing');
              if (typing) typing.remove();
            }
          } catch(_){}
        });

        es.addEventListener('delta', (e) => {
          try {
            const d = JSON.parse(e.data || '{}');
            const delta = d.delta || '';
            if (delta) {
              if (skipLeadingWhitespace) {
                const trimmed = delta.trimStart();
                if (trimmed.length > 0) {
                  rawAnswerText += trimmed;
                  skipLeadingWhitespace = false;
                }
              } else {
                rawAnswerText += delta;
              }
              if (!skipLeadingWhitespace) renderAnswerWithImages(answerEl, rawAnswerText, []);
              scrollToBottom();
            }
          } catch(_){}
        });

        const handleFinal = (e) => {
          try {
            const d = JSON.parse(e.data || '{}');
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim().length > 0)
              ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
            const stages = botMsgEl.querySelector('.stages');
            if (stages && d.done_list) renderStages(botMsgEl, d.done_list, [], 'completed');
          } catch(_){}
          finalizeBotAnswer(botMsgEl);
          finish();
        };
        es.addEventListener('final', handleFinal);
        es.addEventListener('final_answer', handleFinal);

        es.addEventListener('error', (e) => {
          try {
            const msg = e && e.data ? (JSON.parse(e.data).error || 'connection interrupted') : 'connection interrupted';
            rawAnswerText += `\n\n(Error: ${msg})`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          } catch(_){
            rawAnswerText += '\n\n(Error: connection interrupted)';
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }
          finalizeBotAnswer(botMsgEl);
          finish();
        });
      } catch(e){
        const bubble = botMsgEl.querySelector('.bubble');
        bubble.querySelector('.typing')?.remove();
        finalizeBotAnswer(botMsgEl, '', e.message || String(e));
        sendBtn.disabled = false;
      }
    }

    // ---------- composer ----------
    function autoResize(){
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + 'px';
    }
    inputEl.addEventListener('input', autoResize);

    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        onSend();
      }
    });

    btnClear.addEventListener('click', async () => {
      if (!confirm('Clear this conversation? This cannot be undone.')) return;
      try {
        await fetch(`${API_BASE}/history/${currentSession()}`, { method: 'DELETE' });
      } catch(e){ console.error(e); }
      resetChatView();
      renderWelcome();
    });

    btnNew.addEventListener('click', startNewChat);

    // ---------- init ----------
    checkHealth();
    renderSessions();
    loadHistory();
    setTimeout(() => inputEl.focus(), 200);
  </script>
</body>
</html>
